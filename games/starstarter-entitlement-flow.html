<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StarStarter — Dual Entitlement Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* game-art palette (from StarStarter header art) */
    --ss-purple:#6F5ABB; --ss-purple-deep:#4E3B95; --ss-lavender:#A488E4;
    --ss-cream:#F9EFCC;  --ss-gold:#EA9C1D;        --ss-red:#DA3142; --ss-coral:#E45A5F;
    /* site design tokens (container chrome) */
    --bg3:#1a1a30; --purple-bright:#a78bfa; --cream:#f0e8ff;
    --border-glass:rgba(160,100,255,0.30); --hover-tint:rgba(167,139,250,0.14);
    --font-ui:'Quicksand',ui-sans-serif,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:transparent;font-family:var(--font-ui)}

  .ss-viewer{
    position:relative;width:100%;height:100%;min-height:420px;
    border-radius:12px;overflow:hidden;
    background:#12122560; border:1px solid var(--border-glass);
  }
  .ss-stage{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none}
  .ss-stage.grabbing{cursor:grabbing}
  .ss-content{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
  .ss-content svg{display:block;max-width:none !important;height:auto}
  /* edge label legibility on dark */
  .ss-content .edgeLabel,.ss-content .edgeLabel p{color:var(--cream) !important;fill:var(--cream) !important;font-family:var(--font-ui) !important;font-weight:600}
  .ss-content .nodeLabel,.ss-content .nodeLabel p{font-family:var(--font-ui) !important;font-weight:600}

  .ss-controls{
    position:absolute;top:12px;right:12px;z-index:5;display:flex;gap:6px;
  }
  .ss-controls button{
    width:34px;height:34px;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-ui);font-size:15px;font-weight:700;line-height:1;
    color:var(--purple-bright);background:rgba(10,10,24,0.72);
    border:1px solid var(--border-glass);border-radius:8px;cursor:pointer;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);transition:all .15s;
  }
  .ss-controls button:hover{border-color:var(--purple-bright);background:var(--hover-tint);color:var(--cream)}
  .ss-controls button.wide{width:auto;padding:0 12px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase}

  .ss-hint{
    position:absolute;left:12px;bottom:10px;z-index:5;
    font-family:var(--font-ui);font-size:11px;letter-spacing:1px;
    color:var(--purple-bright);opacity:.62;pointer-events:none;user-select:none;
  }
  .ss-legend{
    position:absolute;left:12px;top:12px;z-index:5;display:flex;flex-wrap:wrap;gap:10px;
    max-width:calc(100% - 130px);
    font-family:var(--font-ui);font-size:10.5px;letter-spacing:.4px;color:var(--cream);
  }
  .ss-legend span{display:inline-flex;align-items:center;gap:5px;opacity:.9}
  .ss-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
  @media (max-width:640px){ .ss-legend{display:none} }
</style>
</head>
<body>
<div class="ss-viewer" id="viewer">
  <div class="ss-legend">
    <span><i style="background:#6F5ABB"></i>Screen</span>
    <span><i style="background:#EA9C1D"></i>Decision</span>
    <span><i style="background:#F9EFCC"></i>Unlocked</span>
    <span><i style="background:#DA3142"></i>Login gate</span>
    <span><i style="background:#E45A5F"></i>Paywall</span>
  </div>
  <div class="ss-controls">
    <button data-act="in"  title="Zoom in">+</button>
    <button data-act="out" title="Zoom out">&minus;</button>
    <button data-act="fit" class="wide" title="Fit to view">Fit</button>
  </div>
  <div class="ss-stage" id="stage"><div class="ss-content" id="content"></div></div>
  <div class="ss-hint">scroll to zoom &middot; drag to pan</div>
</div>

<script type="module">
import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";

const SRC = `%%{init: {'theme':'base','themeVariables':{'fontFamily':'Quicksand, sans-serif','lineColor':'#A488E4','primaryColor':'#6F5ABB','primaryTextColor':'#F9EFCC','primaryBorderColor':'#4E3B95','edgeLabelBackground':'#1a1a30','textColor':'#f0e8ff'}}}%%
flowchart TD
    Launch(["Launch"]) --> Preload["PreloadScene"]
    Preload --> Stored{"Stored login?"}
    Stored -->|"no"| Login["LoginScene"]
    Stored -->|"yes"| Refresh["Token refresh"]
    Refresh -->|"fail / 10s"| Login
    Refresh -->|"got token"| Decode["Decode org_id"]
    Decode --> EntA{"Enterprise org?"}
    EntA -->|"yes · skips store"| Daily{"Assessments due?"}
    EntA -->|"no"| StoreA{"Store entitled?"}
    StoreA -->|"yes"| Daily
    StoreA -->|"no / 11s"| Login
    Daily -->|"yes"| Assess["AssessmentsScene"]
    Daily -->|"no"| Content["MainScene · gated content"]
    Assess --> Content
    Login -->|"silent re-login"| Finalize["FinalizeLogin"]
    Login -->|"no credentials"| Intro["Intro screen"]
    Intro -->|"register"| Reg["Register"]
    Intro -->|"login"| SignIn["Login screen"]
    Reg -->|"org_id = platform"| SignUp["Cognito SignUp"]
    SignUp --> Verify["Email verify"]
    Verify --> Apa["APA Labs screen"]
    SignIn -->|"got token"| Decode
    SignIn --> Finalize
    Finalize --> EntB{"Enterprise org?"}
    EntB -->|"yes · short-circuit"| Content
    EntB -->|"no · wait for IAP"| StoreB{"Store entitled?"}
    StoreB -->|"yes"| Content
    StoreB -->|"no"| Apa
    Apa --> Paywall["Paywall"]
    Paywall -.->|"Android only"| Promo["Promo code · picks SKU"]
    Promo -.-> Paywall
    Paywall --> Buy["Store purchase"]
    Paywall -->|"already entitled"| SubDone["SubscriptionComplete"]
    Buy -->|"failed"| Paywall
    Buy -->|"purchased"| SubDone
    SubDone --> Content

    classDef start fill:#A488E4,stroke:#6F5ABB,color:#2A1D52,stroke-width:1.5px;
    classDef screen fill:#6F5ABB,stroke:#4E3B95,color:#F9EFCC,stroke-width:1.5px;
    classDef decision fill:#EA9C1D,stroke:#B87A0E,color:#3A2A05,stroke-width:1.5px;
    classDef success fill:#F9EFCC,stroke:#6F5ABB,color:#4E3B95,stroke-width:2.5px;
    classDef fail fill:#DA3142,stroke:#8F1B2C,color:#FFF3F3,stroke-width:1.5px;
    classDef pay fill:#E45A5F,stroke:#B52542,color:#FFF3F3,stroke-width:1.5px;
    class Launch start;
    class Preload,Refresh,Decode,Assess,Intro,Reg,SignUp,Verify,SignIn,Finalize,Apa,Promo,Buy,SubDone screen;
    class Stored,EntA,StoreA,Daily,EntB,StoreB decision;
    class Content success;
    class Login fail;
    class Paywall pay;`;

mermaid.initialize({ startOnLoad:false, securityLevel:"loose", flowchart:{ curve:"basis", useMaxWidth:false }, theme:"base" });

const stage = document.getElementById("stage");
const content = document.getElementById("content");

let scale = 1, tx = 0, ty = 0, natW = 0, natH = 0;
function apply(){ content.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; }
function clampScale(s){ return Math.min(6, Math.max(0.15, s)); }

function fit(){
  const r = stage.getBoundingClientRect();
  if(!natW || !natH) return;
  const pad = 24;
  const s = Math.min((r.width-pad*2)/natW, (r.height-pad*2)/natH);
  scale = clampScale(s);
  tx = (r.width - natW*scale)/2;
  ty = (r.height - natH*scale)/2;
  apply();
}
function zoomAt(cx, cy, factor){
  const r = stage.getBoundingClientRect();
  const px = cx - r.left, py = cy - r.top;
  const ns = clampScale(scale*factor);
  const k = ns/scale;
  tx = px - (px - tx)*k;
  ty = py - (py - ty)*k;
  scale = ns; apply();
}

(async () => {
  const { svg } = await mermaid.render("ssflow", SRC);
  content.innerHTML = svg;
  const el = content.querySelector("svg");
  const vb = (el.getAttribute("viewBox")||"").split(/\s+/).map(Number);
  natW = vb[2] || el.getBBox().width;
  natH = vb[3] || el.getBBox().height;
  el.removeAttribute("width"); el.removeAttribute("height");
  el.style.width = natW+"px"; el.style.height = natH+"px";
  fit();
})();

// wheel zoom
stage.addEventListener("wheel", (e)=>{ e.preventDefault(); zoomAt(e.clientX, e.clientY, e.deltaY<0?1.12:0.89); }, {passive:false});

// pointer pan + pinch
const pts = new Map(); let pinchDist = 0, pinchMid = null;
stage.addEventListener("pointerdown", (e)=>{ stage.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); stage.classList.add("grabbing"); });
stage.addEventListener("pointermove", (e)=>{
  if(!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===1){ tx += e.clientX-prev.x; ty += e.clientY-prev.y; apply(); }
  else if(pts.size===2){
    const [a,b] = [...pts.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y);
    const mid = {x:(a.x+b.x)/2, y:(a.y+b.y)/2};
    if(pinchDist){ zoomAt(mid.x, mid.y, d/pinchDist); }
    pinchDist = d; pinchMid = mid;
  }
});
function endPtr(e){ pts.delete(e.pointerId); if(pts.size<2) pinchDist=0; if(pts.size===0) stage.classList.remove("grabbing"); }
stage.addEventListener("pointerup", endPtr);
stage.addEventListener("pointercancel", endPtr);
stage.addEventListener("pointerleave", endPtr);

document.querySelector('.ss-controls').addEventListener("click",(e)=>{
  const b = e.target.closest("button"); if(!b) return;
  const r = stage.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
  if(b.dataset.act==="in")  zoomAt(cx,cy,1.25);
  if(b.dataset.act==="out") zoomAt(cx,cy,0.8);
  if(b.dataset.act==="fit") fit();
});
window.addEventListener("resize", ()=>fit());
</script>
</body>
</html>
